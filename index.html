<!DOCTYPE html>
<html lang="zh-TW" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>策略看板 | Strategy Board</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="策略看板">
    <meta name="theme-color" content="#121110">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="shortcut icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-root: #121110;
            --bg-surface: #1A1816;
            --bg-card: #211F1C;
            --bg-elevated: #2A2723;
            --bg-input: #161412;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-default: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(167, 139, 250, 0.35);
            --text-primary: #F1ECE4;
            --text-secondary: #B3AA9E;
            --text-muted: #8A8176;
            --accent: #A78BFA;
            --green: #34D399;
            --red: #F87171;
            --amber: #FBBF24;
            --cyan: #22D3EE
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-root);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden
        }

        ::-webkit-scrollbar {
            width: 4px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px
        }

        input,
        select {
            background: var(--bg-input);
            border: 1px solid var(--border-default);
            color: #fff;
            border-radius: 8px;
            transition: border-color .15s
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.15)
        }

        .coin-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all .2s ease;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .coin-card:hover {
            background: var(--bg-elevated);
            border-color: var(--border-hover)
        }

        .coin-card:active {
            transform: scale(0.98)
        }

        .coin-card.holding {
            border-left: 3px solid var(--accent)
        }

        .coin-card.target-hit {
            border: 1px solid rgba(251, 191, 36, 0.5);
            border-left: 3px solid var(--amber);
            animation: gold-pulse 2.5s ease-in-out infinite
        }

        .coin-card.stopped-out {
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-left: 3px solid var(--red);
        }

        @keyframes gold-pulse {

            0%,
            100% {
                box-shadow: 0 0 8px rgba(251, 191, 36, 0.2)
            }

            50% {
                box-shadow: 0 0 20px rgba(251, 191, 36, 0.3)
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .coin-card {
            animation: fadeUp .3s ease both
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all .3s ease;
            z-index: 40
        }

        .overlay.active {
            opacity: 1;
            visibility: visible
        }

        #side-panel, #notif-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(320px, 85vw);
            background: var(--bg-surface);
            border-left: 1px solid var(--border-subtle);
            transform: translateX(100%);
            transition: transform .35s cubic-bezier(.4, 0, .2, 1);
            z-index: 50;
            overflow-y: auto;
            padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px) 20px;
        }

        #side-panel.open, #notif-panel.open {
            transform: translateX(0)
        }

        .notif-badge {
            position: absolute; top: -2px; right: -2px;
            min-width: 16px; height: 16px;
            background: var(--red); color: #fff;
            border-radius: 99px; font-size: 9px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px; line-height: 1;
            border: 2px solid var(--bg-root);
            pointer-events: none;
        }
        .notif-badge:empty, .notif-badge[data-count="0"] { display: none; }

        .notif-item {
            padding: 12px 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            transition: all .15s ease;
        }
        .notif-item:hover { background: rgba(255,255,255,0.04); }
        .notif-item + .notif-item { margin-top: 8px; }
        .notif-item .notif-emoji { font-size: 18px; line-height: 1; }
        .notif-item .notif-title { font-size: 12px; font-weight: 600; color: var(--text-primary); }
        .notif-item .notif-body { font-size: 10px; color: var(--text-secondary); margin-top: 3px; line-height: 1.5; }
        .notif-item .notif-time { font-size: 9px; color: var(--text-muted); margin-top: 5px; font-family: monospace; }

        #bottom-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: 85vh;
            background: var(--bg-surface);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px 20px 0 0;
            transform: translateY(100%);
            transition: transform .35s cubic-bezier(.4, 0, .2, 1);
            z-index: 50;
            overflow-y: auto;
            padding: 12px 20px calc(env(safe-area-inset-bottom) + 32px)
        }

        #bottom-sheet.open {
            transform: translateY(0)
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            margin: 0 auto 16px
        }

        #sort-menu {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-surface);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px 20px 0 0;
            transform: translateY(100%);
            transition: transform .35s cubic-bezier(.4, 0, .2, 1);
            z-index: 45;
            padding: 16px 20px 100px
        }

        #sort-menu.open {
            transform: translateY(0)
        }

        #pill-menu {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 46;
            background: rgba(26, 24, 22, 0.82);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 5px 6px;
            display: flex;
            align-items: center;
            gap: 2px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4)
        }

        .pill-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 10px 14px;
            border-radius: 44px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all .15s ease;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent
        }

        .pill-btn:active {
            transform: scale(0.95)
        }

        .pill-btn.active {
            color: var(--accent);
            background: rgba(167, 139, 250, 0.12)
        }

        .pill-filter {
            flex: 1;
            text-align: center;
            padding: 10px 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            cursor: pointer;
            border-radius: 44px;
            transition: all .15s ease;
            -webkit-tap-highlight-color: transparent;
            border: none;
            background: transparent
        }

        .pill-filter:active {
            transform: scale(0.95)
        }

        #pill-search {
            display: none;
            flex: 1;
            align-items: center;
            gap: 8px;
            padding: 0 4px
        }

        #pill-search.active {
            display: flex
        }

        #pill-search input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            width: 100%;
            padding: 8px 0
        }

        #pill-search input:focus {
            outline: none;
            box-shadow: none
        }

        .sort-opt {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all .15s ease;
            -webkit-tap-highlight-color: transparent
        }

        .sort-opt:hover {
            background: rgba(255, 255, 255, 0.04)
        }

        .sort-opt:active {
            transform: scale(0.98)
        }

        .sort-opt.active {
            background: rgba(167, 139, 250, 0.1);
            color: var(--accent)
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 0;
            border-bottom: 1px solid var(--border-subtle)
        }

        .detail-row:last-child {
            border-bottom: none
        }

        .optional-detail {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all .3s ease;
            border-top: 1px solid transparent;
            margin-top: 0
        }

        @media (hover: hover) {
            .coin-card:hover .optional-detail {
                max-height: 200px;
                opacity: 1;
                margin-top: 10px;
                padding-top: 10px;
                border-top-color: rgba(255, 255, 255, 0.04);
            }
        }

        .coin-card.expanded .optional-detail {
            max-height: 200px;
            opacity: 1;
            margin-top: 10px;
            padding-top: 10px;
            border-top-color: rgba(255, 255, 255, 0.04);
        }

        /* === GLOBAL DASHBOARD === */
        #gd {
            position: fixed;
            bottom: 90px;
            left: 14px;
            z-index: 47;
            width: 38px;
            height: 38px;
            background: rgba(26,24,22,0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 19px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            overflow: hidden;
            transition: all .35s cubic-bezier(.4,0,.2,1);
            max-height: 38px;
            cursor: pointer;
        }
        #gd:hover, #gd.open {
            width: min(310px, calc(100vw - 28px));
            border-radius: 16px;
        }
        #gd.open { max-height: 700px; height: auto; cursor: default; }
        
        #gd-header-wrap {
            display: flex;
            width: min(310px, calc(100vw - 28px));
            height: 38px;
            align-items: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        #gd-header-icon {
            display: flex; justify-content: center; align-items: center;
            width: 38px; height: 38px; flex-shrink: 0; font-size: 15px;
        }
        #gd-header-content {
            display: flex; align-items: center; justify-content: space-between;
            flex: 1; padding-right: 12px;
            opacity: 0; transition: opacity .2s; white-space: nowrap;
        }
        #gd:hover #gd-header-content, #gd.open #gd-header-content {
            opacity: 1;
        }
        #gd-body { padding: 0 12px 14px; }
        .gd-lbl {
            font-size: 9px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .06em; color: var(--text-muted); margin-bottom: 3px;
        }
        .gd-val { font-size: 13px; font-weight: 700; font-family: monospace; }
        .gd-inp {
            width: 100%; font-size: 12px; padding: 6px 8px; border-radius: 8px;
            background: var(--bg-input); border: 1px solid var(--border-default);
            color: #fff; transition: border-color .15s;
        }
        .gd-inp:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(167,139,250,.15); }
        .gd-divider { height:1px; background:rgba(255,255,255,.05); margin: 10px 0; }
        .prog-wrap { margin-top: 6px; }
        .prog-row-labels { display:flex; justify-content:space-between; font-size:9px; color:var(--text-muted); margin-bottom:2px; }
        .prog-track {
            position: relative; height: 7px;
            background: rgba(255,255,255,.06); border-radius: 99px;
            overflow: visible; margin: 3px 0;
        }
        .prog-fill {
            position:absolute; left:0; top:0; height:100%; border-radius:99px;
            transition: width .6s ease;
        }
        .prog-dot {
            position:absolute; top:50%; transform:translate(-50%,-50%);
            width:11px; height:11px; border-radius:50%;
            border: 2px solid #161412; transition: left .6s ease;
        }
        .prog-bot-labels { display:flex; justify-content:space-between; font-size:9px; color:var(--text-muted); margin-top:2px; }

        @media (min-width: 1024px) {
            #bottom-sheet, #sort-menu {
                right: 0;
                left: auto;
                width: 400px;
                top: 0;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                border-top: none;
                border-left: 1px solid var(--border-subtle);
                transform: translateX(100%);
                padding: calc(env(safe-area-inset-top) + 24px) 24px 24px 24px;
            }
            #bottom-sheet.open, #sort-menu.open { transform: translateX(0); }
            .sheet-handle { display: none; }
            #pill-menu { display: none !important; }

            #gd {
                top: 0;
                bottom: 0;
                left: 0;
                width: 320px;
                max-height: 100vh;
                height: 100vh;
                border-radius: 0;
                cursor: default;
                box-shadow: none;
                background: var(--bg-surface);
                border: none;
                border-right: 1px solid var(--border-subtle);
                padding-top: calc(env(safe-area-inset-top) + 20px);
                z-index: 40;
            }
            #gd:hover, #gd.open { width: 320px; max-height: 100vh; }
            #gd-header-wrap {
                width: 100%;
                cursor: default;
                height: auto;
                border-bottom: 1px solid rgba(255,255,255,0.04);
                margin-bottom: 12px;
                padding: 10px 20px 20px 20px;
            }
            #gd-header-icon { font-size: 24px; width: 40px; height: 40px; justify-content: flex-start; }
            #gd-header-content { opacity: 1; }
            #gd-header-content > div > span:first-child { font-size: 14px !important; font-weight: 700 !important; color: #fff !important; }
            #gd-chevron { display: none; }
            
            #gd-body { padding: 0 20px 24px 20px; }
            #gd-body .gd-lbl { font-size: 10px; margin-bottom: 6px; color: #B3AA9E; }
            #gd-body .gd-inp { font-size: 14px; padding: 10px 12px; line-height: 1.4 !important; }
            #gd-body .gd-val { font-size: 17px; }
            #gd-body > div[style*="background"] { padding: 12px 14px !important; margin-bottom: 16px !important; }
            #gd-body .gd-divider { margin: 20px 0; }
            #gd-body .prog-row-labels span, #gd-body .prog-bot-labels span { font-size: 10px; }
            #gd-body .prog-wrap { margin-top: 12px !important; }
            #gd-body .prog-track { height: 8px; margin: 8px 0; }
            #gd-body .prog-dot { width: 14px; height: 14px; border-width: 3px; }
            
            #coin-container {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
            }
            #coin-container > .py-16 { grid-column: 1 / -1; }
            
            @media (min-width: 1440px) {
                #coin-container { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            }
        }

        /* ===== UX refinements ===== */
        :root{--text-muted:#8A8176;--font-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}
        body{font-family:'Manrope','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
        .font-mono,.gd-val{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
        .text-\[9px\]{font-size:11px!important}.text-\[10px\]{font-size:12px!important}.text-\[11px\]{font-size:12.5px!important}
        :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
        @media (pointer:coarse){input,select{font-size:16px!important}}
        .coin-card{animation:none}
        #coin-container:not(.rendered) .coin-card{animation:fadeUp .3s ease both}
        .coin-card.target-hit{animation:none;box-shadow:0 0 18px rgba(251,191,36,.18)}
        @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
        #chip-row{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
        #chip-row::-webkit-scrollbar{display:none}
        .chip{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--text-secondary);background:rgba(255,255,255,.04);border:1px solid var(--border-default);cursor:pointer;transition:background .15s,color .15s}
        .chip b{font-weight:500;font-size:11px;opacity:.7;font-family:var(--font-mono)}
        .chip.active{color:var(--accent);background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.4)}
        #pill-filter-label,#desktop-filter-label,#desktop-filter-label+div{display:none}
        .sheet-close{display:none;position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);color:var(--text-secondary);font-size:20px;align-items:center;justify-content:center;border:none;cursor:pointer}
        @media (min-width:1024px){.sheet-close{display:flex}#bottom-sheet{padding-top:64px}}

        /* ===== Redesign: 暖炭黑 × 薰衣草 ===== */
        .coin-card{border-radius:14px;padding:14px 16px 12px;box-shadow:none}
        .coin-card:hover{border-color:rgba(167,139,250,.3)}
        .coin-card.holding{border-left:1px solid var(--border-subtle);box-shadow:inset 3px 0 0 var(--accent)}
        .coin-card.target-hit{border:1px solid rgba(251,191,36,.35);box-shadow:inset 3px 0 0 var(--amber),0 0 18px rgba(251,191,36,.12)}
        .coin-card.stopped-out{border:1px solid rgba(248,113,113,.25);box-shadow:inset 3px 0 0 var(--red)}
        .coin-mono{flex:none;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:.02em;background:hsl(var(--h) 30% 21%);color:hsl(var(--h) 65% 78%)}
        .text-\[22px\]{font-family:var(--font-mono);font-size:24px!important;font-weight:500!important;letter-spacing:-.02em}
        .rail{position:relative;height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin:4px 0 0}
        .rail-f{position:absolute;left:0;top:0;bottom:0;border-radius:4px;opacity:.85}
        .rail-e{position:absolute;top:-3px;width:2px;height:10px;background:var(--text-secondary);border-radius:1px}
        .rail-p{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--bg-card)}
        .rail-l{display:flex;justify-content:space-between;margin-top:7px;font:500 11px var(--font-mono);color:var(--text-muted)}
        header h1{font-weight:800;letter-spacing:.01em}
        .chip{border-radius:9px}
        #pill-menu{border-radius:20px;padding:5px}
        .pill-btn{border-radius:15px}
        #side-panel button:not([onclick="toggleSidePanel()"]){background:rgba(255,255,255,.05)!important;color:var(--text-primary)!important;border:1px solid var(--border-default)!important;border-radius:10px!important}
        #side-panel button:not([onclick="toggleSidePanel()"]):hover{background:rgba(255,255,255,.1)!important}
        #gd{border-radius:20px}
        .gd-ico{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.28);color:var(--accent)}
        .gd-ico svg{width:15px;height:15px}
        @media (min-width:768px){.gd-ico{width:32px;height:32px;border-radius:10px}.gd-ico svg{width:18px;height:18px}}
        .note-chip{font-size:11px;line-height:1;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--text-secondary);cursor:pointer;-webkit-tap-highlight-color:transparent}
        .note-chip.on{background:rgba(167,139,250,.2);border-color:rgba(167,139,250,.55);color:#ddd6fe}
        .note-chip.add{border-style:dashed;color:var(--text-muted)}
        .note-pill{font-size:10px;line-height:1;padding:3px 8px;border-radius:999px;border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.1);color:#fbbf24;cursor:pointer;font-weight:600}
    </style>
</head>

<body class="min-h-screen pb-24">

    <!-- Global Dashboard -->
    <div id="gd">
        <div id="gd-header-wrap" onclick="toggleGD()">
            <div id="gd-header-icon"><span class="gd-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></span></div>
            <div id="gd-header-content">
                <div style="display:flex;align-items:center;gap:7px">
                    <span style="font-size:11px;font-weight:600;color:var(--text-secondary)">資金看板</span>

    async function fetchFromCloud(silent = false) { 
        if (!silent) saveSyncConfig(); 
        if (!cloudBin) { if (!silent) showToast('請填寫 Bin ID！', 'error'); return } 
        try { 
            const r = await fetch("https://api.jsonbin.io/v3/b/" + cloudBin + "/latest", { method: 'GET', headers: { 'X-Master-Key': cloudKey || DEFAULT_API_KEY } }); 
            const d = await r.json(); 
            if (d.record) { 
                const c = d.record; 
                Object.keys(c).forEach(k => { 
                    if (k !== '__GLOBAL__' && k !== '__NOTIF_LOG__' && !REMOVED_COINS.includes(k.toUpperCase()) && !COIN_LIST.includes(k.toUpperCase())) { 
                        COIN_LIST.push(k.toUpperCase()); 
                        userSettings[k.toUpperCase()] = { entry: 0, target: 0, stopLoss: 0, isHolding: false, lastManualUpdate: 0, note: '', entrySide: null, capital: 0, leverage: 1, manualStatus: null }; 
                    } 
                }); 
                COIN_LIST.forEach(coin => { 
                    const k = c[coin] || c[coin.toLowerCase()]; 
                    if (k) {
                        userSettings[coin] = { 
                            entry: k.entry || 0, 
                            target: k.target || 0, 
                            stopLoss: k.stopLoss || 0, 
                            isHolding: k.isHolding || false, 
                            lastManualUpdate: k.lastManualUpdate || 0, 
                            note: k.note || '', 
                            entrySide: k.entrySide || null, 
                            capital: k.capital || 0, 
                            leverage: k.leverage || 1, 
                            manualStatus: k.manualStatus || null 
                        };
                    }
                }); 
                
                // 💡 讀取雲端的通知紀錄，並將新紀錄加入到本地！
                if (c['__NOTIF_LOG__']) {
                    userSettings['__NOTIF_LOG__'] = c['__NOTIF_LOG__'];
                    let localIds = new Set(notifLog.map(n => n.id));
                    let addedNew = false;
                    
                    // 雲端陣列最新的在最前面，所以我們從後面開始倒著加入本地陣列，維持順序正確
                    for (let i = c['__NOTIF_LOG__'].length - 1; i >= 0; i--) {
                        const cn = c['__NOTIF_LOG__'][i];
                        if (!localIds.has(cn.id)) {
                            notifLog.unshift({ ...cn, read: false });
                            addedNew = true;
                        }
                    }
                    
                    if (addedNew) {
                        notifLog.sort((a, b) => b.time - a.time);
                        if (notifLog.length > 100) notifLog = notifLog.slice(0, 100);
                        localStorage.setItem('notifLog', JSON.stringify(notifLog));
                        updateNotifBadge();
                        renderNotifList();
                    }
                }

                if(c['__GLOBAL__']){ 
                    userSettings['__GLOBAL__'] = c['__GLOBAL__']; 
                    gdRealized = c['__GLOBAL__'].realizedPnL || 0; 
                    localStorage.setItem('gdRealized', gdRealized); 
                    const rEl = document.getElementById('gd-realized'); 
                    if(rEl) rEl.value = gdRealized; 
                    if(typeof gdUpdate === 'function') gdUpdate(); 
                } 
                saveSettings(); 
                fetchExchangeData(); 
                if (!silent) showToast("✅ 已讀取雲端資料！") 
            } else { 
                if (!silent) showToast("❌ " + (d.message || JSON.stringify(d)), 'error') 
            } 
        } catch (e) { 
            if (!silent) showToast("❌ " + e.message, 'error') 
        } 
    }

    // 每個交易對各打一次 ticker/price?symbol=XXX（例如 ?symbol=DOGEBTC），互不影響；查不到的交易對直接略過
    async function fetchBinanceOne(pair) {
        const res = await fetchWithTimeout(`${BINANCE_PRICE_URL}?symbol=${pair}`, 10000);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        const n = Number(d && d.price);
        if (!(n > 0)) throw new Error('無價格');
        return n;
    }
    async function fetchBinancePrices(symbols) {
        const pairOf = {};   // 幣種代號 → 幣安交易對
        symbols.forEach(s => { pairOf[s] = BINANCE_BTC_PAIRS[s] || (s + 'USDT'); });
        const entries = await Promise.all(symbols.map(sym =>
            fetchBinanceOne(pairOf[sym]).then(v => [sym, v]).catch(e => { console.warn('[Binance 無資料]', sym, '→', pairOf[sym], e.message); return [sym, 0]; })
        ));
        const out = {};
        let anyOk = false;
        entries.forEach(([sym, v]) => {
            if (v > 0) { anyOk = true; out[sym] = { price: v, change: 0, vol: 0, src: 'Binance', quote: BINANCE_BTC_PAIRS[sym] ? 'BTC' : 'USDT' }; }
        });
        if (!anyOk) throw new Error('Binance 全部請求失敗');
        return out;
    }

    // 主／備用金鑰：依序嘗試，前一把失敗（額度、金鑰錯誤、被擋）就換下一把
    function cgKeyList() {
        const all = [
            { n: 1, key: COINGECKO_API_KEY, plan: COINGECKO_PLAN, name: '主' },
            { n: 2, key: COINGECKO_API_KEY_BACKUP, plan: COINGECKO_PLAN_BACKUP, name: '備用1' },
            { n: 3, key: COINGECKO_API_KEY_BACKUP2, plan: COINGECKO_PLAN_BACKUP2, name: '備用2' },
            { n: 4, key: COINGECKO_API_KEY_BACKUP3, plan: COINGECKO_PLAN_BACKUP3, name: '備用3' },
            { n: 5, key: COINGECKO_API_KEY_BACKUP4, plan: COINGECKO_PLAN_BACKUP4, name: '備用4' }
        ].filter(k => k.key);
        const now = Date.now(), dead = k => cgDeadUntil[k.n] > now;
        return all.filter(k => !dead(k)).concat(all.filter(dead));   // 沒失敗過的照順序在前
    }

    async function cgRequest(idsStr) {
        const keys = cgKeyList();
        let lastErr;
        for (const k of keys) {
            const pro = k.plan === 'pro';
            const qs = new URLSearchParams({ ids: idsStr, vs_currencies: 'usd', include_24hr_change: 'true', include_24hr_vol: 'true', precision: 'full' });
            qs.set(pro ? 'x_cg_pro_api_key' : 'x_cg_demo_api_key', k.key);
            try {
                let res;
                try { res = await fetchWithTimeout(`https://${pro ? 'pro-api' : 'api'}.coingecko.com/api/v3/simple/price?${qs.toString()}`, 20000); }
                catch (e) { const err = new Error(e.name === 'AbortError' ? '請求逾時' : '網路錯誤或被瀏覽器 CORS 擋下（常見於 429 限流或網路封鎖）'); err.network = true; throw err; }
                if (!res.ok) {
                    let body = ''; try { body = (await res.text()).slice(0, 200); } catch (e) {}
                    const err = new Error('HTTP ' + res.status + (body ? ' ' + body : '')); err.status = res.status; throw err;
                }
                const data = await res.json();
                if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('回傳格式異常：' + JSON.stringify(data).slice(0, 200));
                if (data.status && data.status.error_message) throw new Error(data.status.error_message);
                delete cgDeadUntil[k.n];
                cgActiveN = k.n;
                if (k.n >= 3) {
                    if (cgWarnedN !== k.n) {
                        cgWarnedN = k.n;
                        showToast(`⚠️ 已用到第 ${k.n} 把 CoinGecko 金鑰，請注意額度！`, 'error');
                        addNotifLog('⚠️', 'CoinGecko 金鑰警示', `前面的金鑰目前無法使用（額度用完或連線失敗），已切換到第 ${k.n} 把金鑰，請注意用量。`, 'stoploss');
                    }
                } else cgWarnedN = 0;
                return data;
            } catch (e) {
                lastErr = e;
                console.warn(`[CoinGecko ${k.name}金鑰失敗]`, e.message);
                if (keys.length > 1) cgDeadUntil[k.n] = Date.now() + 600000;
            }
        }
        if (keys.length > 1) lastErr.message = '所有金鑰皆失敗：' + lastErr.message;
        throw lastErr;
    }

    // 送出單一批次（/simple/price + ids），回傳 { 幣種代號: {price, change, vol, src} }；失敗時丟出錯誤
    async function fetchCoinGeckoBatch(symbols, extraIds = []) {
        const idToSym = {};
        symbols.forEach(sym => { idToSym[COIN_ID_MAP[sym]] = sym; });
        const data = await cgRequest(Object.keys(idToSym).concat(extraIds).join(','));
        const out = {};
        Object.keys(idToSym).forEach(id => {
            const t = data[id];
            if (!t || t.usd == null) { console.warn('[CoinGecko 無資料]', idToSym[id], '→', id); return; }
            out[idToSym[id]] = {
                price: Number(t.usd),
                change: Number(t.usd_24h_change) || 0,
                vol: Number(t.usd_24h_vol) || 0,
                src: 'CoinGecko'
            };
        });
        return out;
    }

    async function fetchExchangeData(force = false) {
        const statusEl = document.getElementById('status-indicator');
        const setStatus = (txt, color) => { if (statusEl) statusEl.innerHTML = `<span style="font-size:10px;color:var(--${color});font-family:var(--font-mono)">${txt}</span>`; };

        if (!cgKeyList().length) {
            console.warn('尚未填入 CoinGecko API 金鑰（index.html 內的 COINGECKO_API_KEY）');
            setStatus('NO KEY', 'amber');
            if (!missingKeyToastShown) { missingKeyToastShown = true; showToast('請先在 index.html 填入 CoinGecko 金鑰', 'error'); }
            if (Object.keys(marketData).length === 0) COIN_LIST.forEach(coin => { marketData[coin] = { price: 0, change: 0, vol: 0, src: '--' }; });
            if (!editingCoin) renderCards();
            return;
        }
        if (isFetchingMarket) return;
        if (!force && Date.now() - lastFetchAt < MIN_FETCH_GAP_MS) return;
        isFetchingMarket = true;

        try {
            const binanceDirect = COIN_LIST.filter(c => BINANCE_ONLY.includes(c) || BINANCE_BTC_PAIRS[c]);
            const mappedCoins = COIN_LIST.filter(c => COIN_ID_MAP[c] && !BINANCE_BTC_PAIRS[c]);   // /BTC 交易對只走幣安（單位不同，不能混用 CoinGecko 美元價）
            const unmapped = COIN_LIST.filter(c => !COIN_ID_MAP[c] && !binanceDirect.includes(c));
            if (unmapped.length) console.warn('[缺少 CoinGecko ID 對照]', unmapped.join(', '));
            const batches = splitIntoBatches(mappedCoins);
            // 各批次錯開 1 秒送出，避免瞬間連發
            const results = await Promise.allSettled(batches.map((b, i) =>
                new Promise(r => setTimeout(r, i * 1000)).then(() => fetchCoinGeckoBatch(b))
            ));

            // 幣安：專用幣（DOGE/BTC、XRP/BTC、ETH/BTC；AI 為 /USDT）＋ CoinGecko 沒報價的備援幣
            const cgMerged = {};
            results.forEach(r => { if (r.status === 'fulfilled') Object.assign(cgMerged, r.value); });
            const binanceList = binanceDirect.concat(BINANCE_FALLBACK.filter(c => COIN_LIST.includes(c) && !cgMerged[c]));
            let binanceOk = false;
            if (binanceList.length) {
                try { Object.assign(cgMerged, await fetchBinancePrices(binanceList)); binanceOk = true; }
                catch (e) { console.warn('[Binance 失敗]', e.message); if (!binanceToastShown) { binanceToastShown = true; showToast('Binance 報價失敗（BTC 交易對／AI）', 'error'); } }
            }

            const merged = {};
            let okCount = 0, rateLimited = false, authError = false, firstErr = '';
            Object.assign(merged, cgMerged);
            if (binanceOk) okCount++;
            results.forEach(r => {
                if (r.status === 'fulfilled') { okCount++; }
                else {
                    const msg = (r.reason && r.reason.message) || String(r.reason);
                    console.warn('[CoinGecko 批次失敗]', msg);
                    if (!firstErr) firstErr = msg;
                    if (r.reason && r.reason.status === 429) rateLimited = true;
                    if (r.reason && (r.reason.status === 401 || r.reason.status === 403)) authError = true;
                }
            });
            if (firstErr) { if (statusEl) statusEl.title = firstErr; showToast('CoinGecko：' + firstErr.slice(0, 80), 'error'); }

            if (okCount === 0) {
                if (Object.keys(marketData).length === 0) COIN_LIST.forEach(coin => { marketData[coin] = { price: 0, change: 0, vol: 0, src: '--' }; });
                setStatus(authError ? 'KEY ERR' : rateLimited ? 'LIMIT' : 'OFFLINE', authError || rateLimited ? 'amber' : 'red');
            } else {
                const failedBatchCoins = new Set();
                results.forEach((r, i) => { if (r.status !== 'fulfilled') batches[i].forEach(c => failedBatchCoins.add(c)); });
                if (!binanceOk) binanceList.forEach(c => failedBatchCoins.add(c));
                COIN_LIST.forEach(coin => {
                    if (merged[coin]) marketData[coin] = merged[coin];
                    else if (failedBatchCoins.has(coin) && marketData[coin]) { /* 該批次失敗：保留舊價 */ }
                    else marketData[coin] = { price: 0, change: 0, vol: 0, src: '--' };
                });
                lastFetchAt = Date.now();
                if (statusEl) statusEl.title = cgActiveN > 1 ? `目前使用第 ${cgActiveN} 把金鑰` : '';
                if (statusEl) statusEl.innerHTML = `<span class="relative flex h-1.5 w-1.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span></span>`;
                if (cgActiveN >= 3) setStatus('KEY ' + cgActiveN, 'amber');   // 用到第 3 把起，狀態燈改成琥珀色文字
            }
            if (!editingCoin) renderCards();
        } catch (e) {
            console.error('fetchExchangeData 失敗:', e);
            setStatus('OFFLINE', 'red');
        } finally {
            isFetchingMarket = false;
        }
    }

    let notifLog = JSON.parse(localStorage.getItem('notifLog') || '[]');

    function addNotifLog(emoji, title, body, type) {
        const entry = { id: Date.now() + '-' + Math.floor(Math.random()*1000), emoji, title, body, type, time: Date.now(), read: false };
        notifLog.unshift(entry);
        if (notifLog.length > 100) notifLog = notifLog.slice(0, 100);
        localStorage.setItem('notifLog', JSON.stringify(notifLog));
        updateNotifBadge();
        renderNotifList();
    }

    function updateNotifBadge() {
        const badge = document.getElementById('notif-badge');
        if (!badge) return;
        const unread = notifLog.filter(n => !n.read).length;
        badge.textContent = unread > 0 ? (unread > 99 ? '99+' : unread) : '';
        badge.setAttribute('data-count', unread);
    }

    function renderNotifList() {
        const container = document.getElementById('notif-list');
        if (!container) return;
        if (notifLog.length === 0) {
            container.innerHTML = '<div class="py-12 text-center text-[#8A8176] text-xs">暫無通知紀錄</div>';
            return;
        }
        container.innerHTML = '';
        let lastDate = '';
        notifLog.forEach(n => {
            const d = new Date(n.time);
            const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
            if (dateStr !== lastDate) {
                lastDate = dateStr;
                const dateEl = document.createElement('div');
                dateEl.className = 'text-[9px] text-[#8A8176] font-semibold uppercase tracking-wide py-2 mt-2 border-b border-white/[0.04]';
                dateEl.textContent = dateStr;
                container.appendChild(dateEl);
            }
            const item = document.createElement('div');
            item.className = 'notif-item' + (n.read ? '' : ' border-l-2 !border-l-[#A78BFA]');
            const timeStr = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
            let typeColor = 'var(--text-secondary)';
            if (n.type === 'entry') typeColor = 'var(--accent)';
            else if (n.type === 'target') typeColor = 'var(--green)';
            else if (n.type === 'stoploss') typeColor = 'var(--red)';
            item.innerHTML = `
                <div class="flex items-start gap-3">
                    <span class="notif-emoji">${n.emoji}</span>
                    <div class="flex-1 min-w-0">
                        <div class="notif-title" style="color:${typeColor}">${n.title}</div>
                        <div class="notif-body">${(n.body || '').replace(/\n/g, '<br>')}</div>
                        <div class="notif-time">${timeStr}</div>
                    </div>
                </div>`;
            container.appendChild(item);
        });
    }

    function clearNotifLog() {
        if (!confirm('確定要清除所有通知紀錄嗎？這將會同步清除雲端的所有紀錄。')) return;
        notifLog = [];
        localStorage.setItem('notifLog', JSON.stringify(notifLog));
        userSettings['__NOTIF_LOG__'] = []; // 💡 同步清空雲端紀錄
        pushToCloud(true);
        updateNotifBadge();
        renderNotifList();
        showToast('✅ 通知紀錄已清除並同步至雲端');
    }

    function markAllNotifRead() {
        notifLog.forEach(n => n.read = true);
        localStorage.setItem('notifLog', JSON.stringify(notifLog));
        updateNotifBadge();
        renderNotifList();
    }

    function enterEditMode() { renderBottomSheet(true) }
    
    function saveEdit() {
        const coin = selectedCoin; if (!coin) return;
        const newEntry = parseFloat(document.getElementById('edit-entry').value) || 0;
        const holdingVal = document.getElementById('edit-holding').value;
        let newHolding = holdingVal === 'true' || holdingVal === 'target_reached';
        let newManualStatus = (holdingVal === 'target_reached' || holdingVal === 'no_market' || holdingVal === 'stopped_out') ? holdingVal : null;
        
        // 💡 自動重置防呆機制：如果原本是「已止損」或「已達標」，且「修改了進場價」，自動解除鎖定狀態變回「觀望中」
        const oldEntry = Number(userSettings[coin].entry) || 0;
        if (newEntry !== oldEntry && (newManualStatus === 'stopped_out' || newManualStatus === 'target_reached')) {
            newHolding = false;
            newManualStatus = null; 
        }

        const newTarget = parseFloat(document.getElementById('edit-target').value) || 0;
        const newSl = parseFloat(document.getElementById('edit-sl').value) || 0;
        const newNote = document.getElementById('edit-note').value || '';
        const newCapital = parseFloat(document.getElementById('edit-capital').value) || 0;
        const newLeverage = parseFloat(document.getElementById('edit-leverage').value) || 1;
        
        let needsTimeUpdate = false;
        if (userSettings[coin].entry !== newEntry ||
            userSettings[coin].target !== newTarget ||
            userSettings[coin].stopLoss !== newSl ||
            userSettings[coin].isHolding !== newHolding ||
            userSettings[coin].manualStatus !== newManualStatus ||
            userSettings[coin].capital !== newCapital ||
            userSettings[coin].leverage !== newLeverage) {
            needsTimeUpdate = true;
        }

        userSettings[coin].entry = newEntry;
        userSettings[coin].target = newTarget;
        userSettings[coin].stopLoss = newSl;
        userSettings[coin].isHolding = newHolding;
        userSettings[coin].manualStatus = newManualStatus;
        userSettings[coin].note = newNote;
        userSettings[coin].capital = newCapital;
        userSettings[coin].leverage = newLeverage;
        
        if (needsTimeUpdate) {
            userSettings[coin].lastManualUpdate = Date.now();
        }

        if (!newHolding && newEntry > 0) { const cp = Number((marketData[coin] || {}).price || 0); if (cp > 0 && cp < newEntry) userSettings[coin].entrySide = 'breakout'; else if (cp > 0 && cp > newEntry) userSettings[coin].entrySide = 'dip'; else userSettings[coin].entrySide = null } else { userSettings[coin].entrySide = null }
        editingCoin = null; saveSettings(); closeBottomSheet(); renderCards(); showToast('✅ 已儲存 ' + coin + ' 計畫');
        const ind = document.getElementById('sync-status'); const ot = ind.innerText; const oc = ind.className;
        ind.className = "text-[11px] px-3 py-1.5 rounded-lg bg-yellow-500/15 text-yellow-500 font-medium mb-6 text-center"; ind.innerText = "上傳中...";
        pushToCloud(false).then(() => { ind.className = oc; ind.innerText = ot });
    }

    function getSortValue(coin) {
        const m = marketData[coin] || { price: 0, change: 0 }; const s = userSettings[coin] || {};
        const p = Number(m.price), e = Number(s.entry), t = Number(s.target);
        switch (currentSort) {
            case 'name': return coin;
            case 'change': return Number(m.change) || 0;
            case 'updateTime': return s.lastManualUpdate || 0;
            case 'expectedGain': return (e > 0 && t > 0) ? ((t - e) / e * 100) : -9999;
            case 'targetDist': return (t > 0 && p > 0) ? ((t - p) / p * 100) : 9999;
            case 'entryDist': return (e > 0 && p > 0) ? (Math.abs(p - e) / e * 100) : 9999;
            default: return 0;
        }
    }

    function renderCards() {
        const container = document.getElementById('coin-container');
        const searchVal = (document.getElementById('searchInput').value || document.getElementById('desktopSearchInput').value || '').toUpperCase();
        let list = COIN_LIST.filter(c => c.toUpperCase().includes(searchVal) || (searchVal && noteTokens((userSettings[c] || {}).note).some(t => t.toUpperCase().includes(searchVal))));
        if (currentFilter === 'holding') list = list.filter(c => (userSettings[c] || {}).isHolding);
        if (currentFilter === 'watching') list = list.filter(c => !(userSettings[c] || {}).isHolding);
        if (currentFilter === 'target_reached') list = list.filter(c => { const s = userSettings[c] || {}; const m = marketData[c] || { price: 0 }; return s.manualStatus === 'target_reached' || (s.isHolding && s.target > 0 && Number(m.price) >= Number(s.target)); });
        if (currentFilter === 'stopped_out') list = list.filter(c => (userSettings[c] || {}).manualStatus === 'stopped_out');
        if (currentFilter === 'no_market') list = list.filter(c => { const s = userSettings[c] || {}; const m = marketData[c] || { src: '--' }; return s.manualStatus === 'no_market' || m.src === '--'; });
        list.sort((a, b) => {
            const va = getSortValue(a), vb = getSortValue(b);
            if (currentSort === 'name') { return sortDirection === 'asc' ? a.localeCompare(b) : b.localeCompare(a) }
            const diff = sortDirection === 'asc' ? va - vb : vb - va;
            return diff;
        });
        container.innerHTML = '';
        renderChips(); setTimeout(() => container.classList.add('rendered'), 700);
        if (list.length === 0) { container.innerHTML = '<div class="py-16 text-center flex flex-col items-center gap-3"><p class="text-[#B3AA9E] text-sm">沒有符合條件的幣種</p><button class="chip" onclick="resetFilters()">清除搜尋與篩選</button></div>'; return }
        
        list.forEach((coin, i) => {
            const m = marketData[coin] || { price: 0, change: 0, vol: 0, src: '--' };
            const s = userSettings[coin] || {};
            const isUp = Number(m.change) >= 0;
            const chgColor = isUp ? 'text-emerald-400' : 'text-red-400';
            const targetHit = s.manualStatus === 'target_reached' || (s.isHolding && s.target > 0 && Number(m.price) >= Number(s.target));
            const stoppedOut = s.manualStatus === 'stopped_out';
            const noMarket = s.manualStatus === 'no_market' || m.src === '--';
            const isActivelyHolding = s.isHolding && !targetHit;
            
            const card = document.createElement('div');
            let cls = 'coin-card group';
            if (isActivelyHolding) cls += ' holding';
            if (targetHit) cls += ' target-hit';
            if (stoppedOut) cls += ' stopped-out';
            card.className = cls; if (expandedCoins.has(coin)) card.classList.add('expanded'); card.setAttribute('role','button'); card.tabIndex = 0; card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBottomSheet(coin) } };
            card.style.animationDelay = `${Math.min(i * 30, 300)}ms`;
            
            if (!isTouchDevice) {
                card.onclick = () => openBottomSheet(coin);
            } else {
                card.addEventListener('touchstart', (e) => {
                    isLongPress = false;
                    isMoving = false;
                    longPressTimer = setTimeout(() => {
                        if (!isMoving) {
                            isLongPress = true;
                            if (navigator.vibrate) navigator.vibrate(60);
                            openBottomSheet(coin);
                        }
                    }, 600); 
                }, { passive: true });

                card.addEventListener('touchmove', () => {
                    isMoving = true;
                    clearTimeout(longPressTimer);
                }, { passive: true });

                card.addEventListener('touchend', (e) => {
                    clearTimeout(longPressTimer);
                    if (!isLongPress && !isMoving) {
                        expandedCoins[card.classList.toggle('expanded') ? 'add' : 'delete'](coin);
                    }
                }, { passive: true });
            }

            const curPrice = Number(m.price);
            const entryPrice = Number(s.entry);
            const targetPrice = Number(s.target);

            let pnlHtml = '';
            if ((isActivelyHolding || targetHit) && entryPrice > 0 && curPrice > 0) {
                const pnlCalcPrice = targetHit && targetPrice > 0 ? targetPrice : curPrice; 
                const pnlPct = ((pnlCalcPrice - entryPrice) / entryPrice * 100 * (s.leverage || 1));
                const pnlColor = pnlPct >= 0 ? 'text-emerald-400' : 'text-red-400';
                const pnlAbs = s.capital > 0 ? (s.capital * pnlPct / 100).toFixed(2) : null;
                const pnlLabel = targetHit ? '結算盈虧 (估)' : '倉位盈虧 (估)';
                pnlHtml = `<div class="text-right flex flex-col items-end">
                <span class="text-[9px] text-[#8A8176] font-bold uppercase tracking-tight">${pnlLabel}</span>
                <span class="${pnlColor} font-mono text-[13px] font-bold">${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}% ${pnlAbs ? `<span class="text-[10px] ml-0.5 opacity-80">($${pnlAbs})</span>` : ''}</span>
            </div>`;
            }

            let railHtml = '';
            if (!noMarket && targetPrice > entryPrice && entryPrice > 0 && curPrice > 0) {
                const slp = Number(s.stopLoss) || 0;
                const lo = (slp > 0 && slp < entryPrice) ? slp : entryPrice - (targetPrice - entryPrice) * 0.5;
                const pos = v => Math.max(0, Math.min(100, (v - lo) / (targetPrice - lo) * 100));
                const col = curPrice >= entryPrice ? 'var(--green)' : 'var(--red)';
                railHtml = `<div><div class="rail"><span class="rail-f" style="width:${pos(curPrice)}%;background:${col}"></span><span class="rail-e" style="left:${pos(entryPrice)}%"></span><span class="rail-p" style="left:${pos(curPrice)}%;background:${col}"></span></div><div class="rail-l"><span>${slp > 0 ? '止損 ' + formatPrice(slp) : ''}</span><span>進場 ${formatPrice(entryPrice)}</span><span>目標 ${formatPrice(targetPrice)}</span></div></div>`;
            }
            let distHtml = '';
            // 💡 改寫這段：給「未有適配市場」專屬的 UI 標記，不會再跳出錯誤的「距觸發」或「已止損」
            if (noMarket) {
                distHtml = `<div class="flex items-center gap-1.5"><span class="text-[10px] text-[#B3AA9E] font-bold">⚠️ 未適配 / 暫無報價</span></div>`;
            } else if (curPrice > 0) {
                if (targetHit) {
                    distHtml = `<div class="flex items-center gap-1.5"><span class="text-[10px] text-amber-400 font-bold">✅ 已達標出場</span></div>`;
                } else if (stoppedOut) {
                    distHtml = `<div class="flex items-center gap-1.5"><span class="text-[10px] text-red-400 font-bold">🛑 已止損出場</span></div>`;
                } else {
                    const goalPrice = isActivelyHolding ? targetPrice : entryPrice;
                    const distLabel = isActivelyHolding ? '距目標' : '距觸發';
                    if (goalPrice > 0) {
                        const distPct = Math.abs(goalPrice - curPrice) / curPrice * 100;
                        distHtml = `<div class="flex items-center gap-1.5">
                        <span class="text-[10px] text-[#8A8176] font-medium">${distLabel}:</span>
                        <span class="text-[11px] font-mono font-bold text-white/90">${distPct.toFixed(2)}%</span>
                    </div>`;
                    } else {
                        distHtml = `<div class="flex items-center gap-1.5 opacity-30"><span class="text-[10px] text-[#8A8176]">無標價</span></div>`;
                    }
                }
            }

            card.innerHTML = `
            <div class="flex flex-col gap-2.5">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="coin-mono" style="--h:${coinHue(coin)}">${coin.slice(0,2)}</span><span class="font-bold text-white text-[16px]">${coin}</span>
                        ${isActivelyHolding ? `<span class="text-[9px] px-1.5 py-0.5 bg-[#A78BFA]/15 text-[#A78BFA] rounded-md border border-[#A78BFA]/30 font-bold tracking-tight">已進場</span>` : ''}
                        ${targetHit ? `<span class="text-[9px] px-1.5 py-0.5 bg-amber-500/15 text-amber-400 rounded-md border border-amber-500/30 font-bold tracking-tight">已達標</span>` : ''}
                        ${stoppedOut ? `<span class="text-[9px] px-1.5 py-0.5 bg-red-500/15 text-red-400 rounded-md border border-red-500/30 font-bold tracking-tight">已止損</span>` : ''}
                    </div>
                    <span class="${chgColor} text-[13px] font-bold font-mono bg-white/[0.03] px-2 py-0.5 rounded-md border border-white/[0.04]">${isUp ? '▲' : '▼'} ${Math.abs(Number(m.change)).toFixed(2)}%</span>
                </div>

                <div class="flex items-end justify-between">
                    <div class="flex flex-col">
                        <span class="text-[9px] text-[#8A8176] font-bold uppercase tracking-tight">現價</span>
                        <span class="text-white font-mono text-[22px] font-semibold leading-tight">${formatPrice(m.price)}</span>
                    </div>
                    ${pnlHtml}
                </div>

                ${railHtml}<div class="flex items-center justify-between pt-2 border-t border-white/[0.04]">
                    ${distHtml}
                    <span class="text-[9px] text-[#8A8176] font-mono font-medium">${formatRelativeTime(s.lastManualUpdate)}</span>
                </div>

                <div class="optional-detail">
                    <div class="flex flex-wrap items-center justify-between gap-1">
                         <div class="flex items-start gap-2 flex-1 min-w-0">
                             <span class="text-[9px] px-1.5 py-0.5 bg-white/[0.05] text-[#B3AA9E] rounded border border-white/[0.1] font-normal shrink-0 mt-0.5">${m.src}</span>
                             ${s.note ? renderNoteHtml(s.note) : '<span class="text-[10px] text-[#8A8176] mt-0.5">無備註</span>'}
                         </div>
                         <div class="flex gap-3">
                            <span class="text-[10px] text-[#8A8176]">目標 <span class="text-[#B3AA9E]">${s.target || '--'}</span></span>
                            <span class="text-[10px] text-[#8A8176]">進場 <span class="text-[#B3AA9E]">${s.entry || '--'}</span></span><button class="chip" style="padding:3px 10px;font-size:12px" ontouchstart="event.stopPropagation()" ontouchend="event.stopPropagation()" onclick="event.stopPropagation();openBottomSheet('${coin}')">詳情</button>
                         </div>
                    </div>

            container.appendChild(card);

    let gdOpen = localStorage.getItem('gdOpen') === 'true';
    let gdRealized = parseFloat(localStorage.getItem('gdRealized')) || 0;
    if (userSettings['__GLOBAL__'] && userSettings['__GLOBAL__'].realizedPnL !== undefined) {

    function toggleGD() {
        if (window.innerWidth >= 1024) return;
        gdOpen = !gdOpen;
        localStorage.setItem('gdOpen', gdOpen);
        document.getElementById('gd').classList.toggle('open', gdOpen);
        document.getElementById('gd-chevron').style.transform = gdOpen ? 'rotate(180deg)' : '';
    }

    function gdGetFloatPnl() {
        let tot = 0;
        COIN_LIST.forEach(coin => {
            const s = userSettings[coin], m = marketData[coin];
            if (!s || !m || !s.isHolding || !s.capital || !s.entry) return;
            const targetHit = s.manualStatus === 'target_reached' || (s.isHolding && s.target > 0 && Number(m.price) >= Number(s.target));
            if (targetHit) return; 
            const p = Number(m.price), e = Number(s.entry), cap = Number(s.capital), lev = Number(s.leverage || 1);
            if (p > 0 && e > 0) tot += cap * ((p - e) / e) * lev;
        });
        return tot;
    }

    function gdCalcProgress() {
        let sumCapital = 0;
        let sumTargetProfit = 0;
        COIN_LIST.forEach(coin => {
            const s = userSettings[coin];
            if (!s || !s.capital) return;
            const cap = Number(s.capital);
            sumCapital += cap;

            const e = Number(s.entry), t = Number(s.target);
            const lev = Number(s.leverage || 1);
            if (e > 0 && t > 0) {
                sumTargetProfit += cap * lev * ((t - e) / e);
            }
        });
        return { sumCapital, sumTargetProfit };
    }

    function gdSaveLocal() {
        gdRealized = parseFloat(document.getElementById('gd-realized').value) || 0;
        localStorage.setItem('gdRealized', gdRealized);
        gdUpdate();
    }

    function gdSaveCloud() {
        gdSaveLocal();
        userSettings['__GLOBAL__'] = { realizedPnL: gdRealized };
        saveSettings();
        pushToCloud(false);
    }

    function gdUpdate() {
        const floatPnl = gdGetFloatPnl();
        const totalProfit = gdRealized + floatPnl;
        const { sumCapital, sumTargetProfit } = gdCalcProgress();

        const pDisp = document.getElementById('gd-principal-disp');
        if (pDisp) { pDisp.textContent = sumCapital.toFixed(2) + ' U'; pDisp.style.color = 'var(--text-primary)'; }
        
        const tDisp = document.getElementById('gd-target-profit-disp');
        if (tDisp) { tDisp.textContent = sumTargetProfit.toFixed(2) + ' U'; tDisp.style.color = 'var(--green)'; }

        const fEl = document.getElementById('gd-float');
        if (fEl) { fEl.textContent = (floatPnl >= 0 ? '+' : '') + floatPnl.toFixed(2) + ' U'; fEl.style.color = floatPnl >= 0 ? 'var(--green)' : 'var(--red)'; }

        const tpEl = document.getElementById('gd-total-profit');
        if (tpEl) { tpEl.textContent = (totalProfit >= 0 ? '+' : '') + totalProfit.toFixed(2) + ' USDT'; tpEl.style.color = totalProfit >= 0 ? 'var(--accent)' : 'var(--red)'; }

        const pill = document.getElementById('gd-pill');
        if (pill) {
            if (sumCapital > 0) {
                const p2 = totalProfit / sumCapital * 100;
                pill.textContent = (p2 >= 0 ? '+' : '') + p2.toFixed(1) + '%';
                pill.style.color = p2 >= 0 ? 'var(--green)' : 'var(--red)';
            } else { pill.textContent = ''; }
        }

        let overallPct = 0;
        if (sumTargetProfit > 0) {
            overallPct = Math.max(0, Math.min(100, totalProfit / sumTargetProfit * 100));
        }
        
        const barAPct = overallPct;
        const aFill = document.getElementById('gd-bar-a-fill');
        const aDot  = document.getElementById('gd-bar-a-dot');
        const aPctLbl = document.getElementById('gd-bar-a-pct');
        const aMidLbl = document.getElementById('gd-bar-a-mid');
        if (aFill) aFill.style.width = barAPct + '%';
        if (aDot)  aDot.style.left   = barAPct + '%';
        if (aPctLbl) { aPctLbl.textContent = barAPct.toFixed(1) + '%'; aPctLbl.style.color = barAPct >= 50 ? 'var(--green)' : 'var(--amber)'; }
        if (aMidLbl) aMidLbl.textContent = barAPct.toFixed(1) + '%';

        const barBPct = barAPct;
        const bFill = document.getElementById('gd-bar-b-fill');
        const bDot  = document.getElementById('gd-bar-b-dot');
        const bLbl  = document.getElementById('gd-bar-b-lbl');
        const bRight= document.getElementById('gd-bar-b-right');
        const bL    = document.getElementById('gd-bar-b-l');
        const bM    = document.getElementById('gd-bar-b-m');
        const bR    = document.getElementById('gd-bar-b-r');
        if (bFill) bFill.style.width = barBPct + '%';
        if (bDot)  bDot.style.left   = barBPct + '%';
        const curU  = totalProfit;
        const tgtU  = sumTargetProfit;
        if (bL) bL.textContent = sumCapital > 0 ? '$' + sumCapital.toLocaleString() : '$0';
        if (bM) { bM.textContent = (curU >= 0 ? '+$' : '-$') + Math.abs(curU).toFixed(0); bM.style.color = curU >= 0 ? 'var(--green)' : 'var(--red)'; }
        if (bR) bR.textContent = tgtU > 0 ? '+$' + tgtU.toFixed(0) : '--';
        if (bLbl) { bLbl.textContent = (curU >= 0 ? '+$' : '-$') + Math.abs(curU).toFixed(2); bLbl.style.color = curU >= 0 ? 'var(--green)' : 'var(--red)'; }
        if (bRight) bRight.textContent = tgtU > 0 ? '目標 +$' + tgtU.toFixed(0) : '(未設目標)';
    }

    function gdInit() {
        const rEl = document.getElementById('gd-realized');
        if (rEl) rEl.value = gdRealized || '';
        document.getElementById('gd').classList.toggle('open', gdOpen);
        document.getElementById('gd-chevron').style.transform = gdOpen ? 'rotate(180deg)' : '';

            document.getElementById('admin-pass').disabled = true;
            document.getElementById('admin-tools').classList.remove('hidden');
            document.getElementById('login-btn').innerText = '登出';
            document.getElementById('login-btn').className = 'w-full py-2.5 bg-red-600/20 text-red-400 border border-red-500/30 rounded-lg text-xs hover:bg-red-600/30 transition font-semibold';
        }
        if (cloudBin) { fetchFromCloud(true); }
        gdInit();
        const tgTEl = document.getElementById('tg-token');
        const tgCEl = document.getElementById('tg-chatid');
        if (tgTEl) tgTEl.value = tgToken || '';
        if (tgCEl) tgCEl.value = tgChatId || '';
        updateNotifyStatus();
        updateNotifBadge();
        renderNotifList();
    }, 100);

    let countdown = REFRESH_SECONDS;
    let cloudSyncCounter = 300; 

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && !editingCoin) {
            console.log('網頁切回前景，自動同步雲端與最新報價...');
            fetchExchangeData();
            if (lastFetchAt && Date.now() - lastFetchAt < MIN_FETCH_GAP_MS) { /* 剛更新過，不重置 */ } else { countdown = REFRESH_SECONDS; }
            cloudSyncCounter = 300;
            if (cloudBin) { 
                fetchFromCloud(true).then(() => {
                    showToast('🔄 已自動同步雲端最新狀態', 'success');
                });
            }
        }
    });

    setInterval(() => {
        countdown--;
        cloudSyncCounter--;
        const cd = document.getElementById('countdown');
        if (editingCoin) { cd.innerHTML = `<span style="color:#fbbf24">⏸ ${countdown}</span>` } else { cd.style.color = ''; cd.textContent = countdown; }
        if (countdown <= 0) { countdown = REFRESH_SECONDS; fetchExchangeData(true); }
        if (cloudSyncCounter <= 0 && cloudBin && !editingCoin) { cloudSyncCounter = 300; fetchFromCloud(true); }
        gdUpdate();
    }, 1000);
    fetchExchangeData(true);


    // ===== UX enhancements =====
    const expandedCoins = new Set();
    const FILTER_LABELS = { all: '全部', holding: '已進場', watching: '未進場', target_reached: '已達標', stopped_out: '已止損', no_market: '未適配' };
    function matchFilter(c, f) {
        const s = userSettings[c] || {}, m = marketData[c];
        switch (f) {
            case 'holding': return !!s.isHolding;
            case 'watching': return !s.isHolding;
            case 'target_reached': return s.manualStatus === 'target_reached' || (s.isHolding && s.target > 0 && m && Number(m.price) >= Number(s.target));
            case 'stopped_out': return s.manualStatus === 'stopped_out';
            case 'no_market': return s.manualStatus === 'no_market' || (m && m.src === '--');
            default: return true;
        }
    }
    function renderChips() {
        const el = document.getElementById('chip-row'); if (!el) return;
        el.innerHTML = Object.keys(FILTER_LABELS).map(f => `<button class="chip${f === currentFilter ? ' active' : ''}" aria-pressed="${f === currentFilter}" onclick="setFilter('${f}')">${FILTER_LABELS[f]}<b>${COIN_LIST.filter(c => matchFilter(c, f)).length}</b></button>`).join('');
    }
    function resetFilters() { ['searchInput', 'desktopSearchInput'].forEach(id => document.getElementById(id).value = ''); setFilter('all'); }
    renderChips();
    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        const open = id => document.getElementById(id).classList.contains('open');
        if (open('bottom-sheet')) closeBottomSheet();
        else if (open('sort-menu')) toggleSortMenu();
        else if (open('notif-panel')) toggleNotifPanel();
        else if (open('side-panel')) toggleSidePanel();
    });
    document.addEventListener('focusin', e => { if (e.target.type === 'number' && !e.target.step) e.target.step = 'any'; });
    const _st = document.getElementById('status-indicator').parentElement;
    _st.style.cursor = 'pointer'; _st.title = '點擊立即更新報價'; _st.setAttribute('role', 'button'); _st.tabIndex = 0;
    _st.onclick = () => { countdown = REFRESH_SECONDS; fetchExchangeData(true); showToast('🔄 正在更新報價'); };
    function coinHue(c){let h=0;for(const ch of c)h=(h*31+ch.charCodeAt(0))%360;return h}
</script>
</body>
